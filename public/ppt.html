      flex-direction: column;
      justify-content: center;

      justify-content: space-between;

      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--mu);

    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      position: relative;
    }
    .progress-fill {

      background: var(--g);

      justify-content: space-between;
      align-items: center;

      gap: 12px;

    .slide-nav {

      align-items: center;
      gap: 8px;

    .g2 { grid-template-columns: 1fr 1fr; }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .g5 { grid-template-columns: repeat(5, 1fr); }
    .card {

      border-radius: 14px;
      padding: 16px;

    th { padding: 10px; background: rgba(255, 255, 255, 0.04); color: var(--mu); text-transform: uppercase; font-size: 11px; }
    td { padding: 10px; border-top: 1px solid var(--line); }

      padding: 2px 6px;
      border-radius: 4px;

    let current = 1;
    const total = slides.length;

    function renderSlide(idx) {
      const s = slides[idx - 1];
      const stage = document.getElementById('slide-stage');
      const counter = document.getElementById('slide-counter');
      const progress = document.getElementById('progress');

      counter.textContent = `Slide ${idx} of ${total}`;
      progress.style.width = `${(idx / total) * 100}%`;

      stage.innerHTML = `
        <div class="slide-header">
          <div>
            <span class="badge" style="margin-bottom:6px; display:inline-block;">${s.category}</span>
            <h2 style="font-size:24px; color:#ffffff;">${s.title}</h2>
            <p style="color:var(--mu); font-size:13px;">${s.subtitle}</p>
          </div>
          <div style="text-align:right;">
            <span style="font-size:11px; color:var(--mu);">SRM EEC · Zeroth Review</span>
            <div style="font-size:12px; font-weight:600; color:var(--g);">Harish Kanna M (310624104095)</div>
          </div>
        </div>

        <div class="slide-body">
          ${s.content}
        </div>

        <div class="slide-footer">
          <span>AI-Driven Food Manufacturing Planning Platform</span>
          <span>Slide ${s.num} / ${total}</span>
        </div>
      `;
    }

    function nextSlide() {
      if (current < total) {
        current++;
        renderSlide(current);
      }
    }

    function prevSlide() {
      if (current > 1) {
        current--;
        renderSlide(current);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    renderSlide(1);
  </script>
